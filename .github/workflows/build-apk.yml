name: Build GymFlow APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run logic tests
        run: npm test

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          # Maven Central sometimes answers "429 Too Many Requests" to shared GitHub runners; retry a few times.
          ok=0
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then ok=1; break; fi
            echo "Attempt $i failed, waiting 45s before retrying"; sleep 45
          done
          [ "$ok" = 1 ]

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GymFlow-AI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
