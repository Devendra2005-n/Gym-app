name: Build GymFlow APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Finds the app folder (the one that has capacitor.config.*), whether the files are in the repo root or inside a sub-folder.
      - name: Locate the app folder
        id: loc
        run: |
          cfg=$(find . -maxdepth 4 -name 'capacitor.config.*' -not -path '*/node_modules/*' | head -1)
          if [ -z "$cfg" ]; then echo "capacitor.config.* not found. Files in the repo:"; ls -la; exit 1; fi
          dir=$(dirname "$cfg")
          echo "App folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: ${{ steps.loc.outputs.dir }}
        run: npm ci || npm install

      - name: Run logic tests
        working-directory: ${{ steps.loc.outputs.dir }}
        run: npm test

      - name: Sync web app into Android project
        working-directory: ${{ steps.loc.outputs.dir }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}/android
        run: |
          chmod +x gradlew
          # Maven Central sometimes answers "429 Too Many Requests" to shared GitHub runners; retry a few times.
          ok=0
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then ok=1; break; fi
            echo "Attempt $i failed, waiting 45s before retrying"; sleep 45
          done
          [ "$ok" = 1 ]

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GymFlow-AI-debug-apk
          path: ${{ steps.loc.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
